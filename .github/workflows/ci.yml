name: Midnight PGP DApp CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Compact Contracts
        run: npm run compact --workspace=@midnight-ntwrk/pgp-contract

      - name: Run Unit Tests
        run: npm run test --workspace=@midnight-ntwrk/pgp-contract -- --run

      - name: Build Contract Package
        run: npm run build --workspace=@midnight-ntwrk/pgp-contract

      - name: Build API Package
        run: npm run build --workspace=@midnight-ntwrk/pgp-api

      - name: Build CLI Package
        run: npm run build --workspace=@midnight-ntwrk/pgp-cli

      - name: Build Web UI Package
        run: npm run build --workspace=@midnight-ntwrk/pgp-ui
